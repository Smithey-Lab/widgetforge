name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - name: Python security analysis (medium and high severity)
        run: python -m bandit -r wf main.py install.py update.py -ll
      - name: Audit installed runtime and development dependencies
        if: ${{ !cancelled() }}
        run: python -m pip_audit --progress-spinner off
      - name: Scan all tracked files for secrets
        if: ${{ !cancelled() }}
        run: git ls-files -z | xargs -0 detect-secrets-hook --no-verify --baseline .secrets.baseline
