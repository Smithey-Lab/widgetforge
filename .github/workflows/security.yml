name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - name: Python security analysis (medium and high severity)
        run: python -m bandit -r wf main.py install.py update.py -ll
      - name: Audit installed runtime and development dependencies
        if: ${{ !cancelled() }}
        run: python -m pip_audit --progress-spinner off
      - name: Scan all tracked files for secrets
        if: ${{ !cancelled() }}
        run: git ls-files -z | xargs -0 detect-secrets-hook --no-verify --baseline .secrets.baseline
