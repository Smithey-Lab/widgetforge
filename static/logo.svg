<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" role="img" aria-labelledby="wf-title">
  <title id="wf-title">WidgetForge</title>
  <defs>
    <linearGradient id="wfBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16D9D0"/>
      <stop offset="50%" stop-color="#0BB9E8"/>
      <stop offset="100%" stop-color="#2864F5"/>
    </linearGradient>
    <!-- Pinned to the canvas, not the text box, so the sweep does not move
         when a different font in the stack resolves. -->
    <linearGradient id="wfBrandText" gradientUnits="userSpaceOnUse"
                    x1="395" y1="40" x2="615" y2="112">
      <stop offset="0%" stop-color="#16D9D0"/>
      <stop offset="45%" stop-color="#0BB9E8"/>
      <stop offset="100%" stop-color="#2864F5"/>
    </linearGradient>
    <linearGradient id="wfIconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#071727"/>
    </linearGradient>
  </defs>

  <g transform="translate(8 8)">
    <path d="M67 0 L125 33 L125 99 L67 132 L9 99 L9 33 Z"
          fill="url(#wfIconBg)" stroke="url(#wfBrand)" stroke-width="6" stroke-linejoin="round"/>
    <!-- W: twelve vertices, mirrored about x=67. Traced top edge first, then
         the underside right to left, so all four strokes carry equal weight. -->
    <path d="M34 36 L47 36 L56 80 L67 52 L78 80 L87 36 L100 36
             L86 96 L80 96 L67 70 L54 96 L48 96 Z" fill="url(#wfBrand)"/>
  </g>

  <text x="158" y="95"
        font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="66" font-weight="650" letter-spacing="-2.5" fill="#E8EEF7">Widget<tspan fill="url(#wfBrandText)">Forge</tspan></text>
</svg>
